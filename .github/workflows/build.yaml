name: Build

# Pull requests build the jar and run the tests, unit plus integration, but
# publish nothing: only tags produce a jar users can download. The integration
# tests start Keycloak through Testcontainers, which works out of the box on
# the GitHub-hosted runners because they ship with Docker.
on:
  pull_request:
    branches:
      - "**"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B clean verify
