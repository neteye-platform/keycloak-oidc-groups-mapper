name: Build

# Pull requests build the jar and run the tests, unit plus integration, but
# publish nothing: only tags produce a jar users can download. The integration
# tests start Keycloak through Testcontainers, which works out of the box on
# the GitHub-hosted runners because they ship with Docker.
on:
  pull_request:
    branches:
      - "**"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21.0.12+101.0.LTS"
          distribution: temurin
          cache: maven
          verify-signature: true

      - name: Build and test
        run: mvn -B clean verify
