name: Release

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21.0.13+9.0.LTS"
          distribution: temurin
          cache: maven
          verify-signature: true

      - name: Check whether the pom version has a GitHub Release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pom_version="$(mvn -q -B help:evaluate \
            -Dexpression=project.version -DforceStdout)"
          tag="v${pom_version}"
          echo "pom_version=$pom_version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_exists=true" >>"$GITHUB_OUTPUT"
            echo "::notice::GitHub Release $tag already exists; nothing to release."
          else
            echo "release_exists=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Releasing $tag."
          fi

      - name: Build
        if: steps.version.outputs.release_exists == 'false'
        env:
          POM_VERSION: ${{ steps.version.outputs.pom_version }}
        run: |
          mvn -B clean package
          test -f "target/keycloak-oidc-group-mapper-${POM_VERSION}.jar"

      - name: Generate GitHub App token
        if: steps.version.outputs.release_exists == 'false'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          app-id: ${{ vars.NETEYE_APP_ID }}
          private-key: ${{ secrets.NETEYE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Tag the release
        if: steps.version.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists; retaining it."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$(git rev-parse HEAD)"
          fi

      - name: Create GitHub release
        if: steps.version.outputs.release_exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ steps.generate-token.outputs.token }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: target/keycloak-oidc-group-mapper-${{ steps.version.outputs.pom_version }}.jar
